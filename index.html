<!doctype html>
<html class="no-js" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visor 3D de Frigobar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css"
      rel="stylesheet" integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl" crossorigin="anonymous">
    <link rel="stylesheet" href="./style/index.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark app-nav">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Graficación</a>
        <span class="navbar-text">Visor 3D de frigobar</span>
      </div>
    </nav>

    <main class="container py-4">
      <div class="toolbar">
        <div class="toolbar-block">
          <label for="file-input">Archivo del modelo</label>
          <input type="file" id="file-input" accept=".txt,.dat" />
        </div>
        <div class="toolbar-buttons">
          <button id="open-lid" type="button" class="btn btn-accent">Abrir puerta</button>
          <button id="close-lid" type="button" class="btn btn-outline-light">Cerrar puerta</button>
          <button id="animate-lid" type="button" class="btn btn-outline-light">Auto abrir/cerrar<table></table></button>
          <button id="reset-view" type="button" class="btn btn-outline-light">Reset vista</button>
        </div>
      </div>

      <div class="toolbar view-toolbar">
        <button id="eyeDown" type="button" class="btn btn-outline-light">Abajo</button>
        <button id="eyeUp" type="button" class="btn btn-outline-light">Arriba</button>
        <button id="eyeLeft" type="button" class="btn btn-outline-light">Izquierda</button>
        <button id="eyeRight" type="button" class="btn btn-outline-light">Derecha</button>
        <button id="incrDist" type="button" class="btn btn-outline-light">Alejar</button>
        <button id="decrDist" type="button" class="btn btn-outline-light">Acercar</button>
      </div>

      <div class="card viewer-card">
        <div class="card-header">Canvas de visualización</div>
        <div class="chart card-img-bottom">
          <canvas id="circlechart" width="900" height="520"></canvas>
        </div>
        <div class="card-body">
          <p id="status-text" class="mb-0">Cargando frigobar...</p>
        </div>
      </div>

      <div class="card viewer-card mt-4">
        <div class="card-header">Contenido del archivo</div>
        <div class="card-body">
          <pre id="contenido-archivo"></pre>
          </div>
      </div>
    </main>

    <footer id="footer" class="py-4">
      <div class="container text-center">
        <a href="#">Proyecto Objeto 3D</a>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-b5kHyXgcpbZJO/tY9Ul7kGkf1S0CWuKcCD38l8YkeH8z8QjE0GmW1gYU5S9FOnJ0" crossorigin="anonymous"></script>
    <script src="./dist/src/index.js?v=20260621-2" type="module"></script>
  </body>
</html>
